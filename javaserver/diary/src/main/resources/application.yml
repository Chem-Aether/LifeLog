server:
  port: ${DIARY_PORT:8085}
jwt:
  secret: ${JWT_SECRET:lifelog-local-dev-secret-change-before-deploy}
  auth:
    enabled: true
spring:
  application:
    name: diary
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DIARY_DB_URL:jdbc:postgresql://localhost:5432/diary}
    username: ${DIARY_DB_USERNAME:postgres}
    password: ${DIARY_DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
springdoc:
  packages-to-scan: com.lifelog.diary

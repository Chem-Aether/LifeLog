server:
  port: ${DIARY_PORT:8085}
media:
  storage:
    endpoint: ${SEAWEED_S3_ENDPOINT:http://127.0.0.1:8333}
    region: ${SEAWEED_S3_REGION:us-east-1}
    bucket: ${SEAWEED_S3_BUCKET:lifelog-media}
    access-key: ${SEAWEED_S3_ACCESS_KEY:lifelog}
    secret-key: ${SEAWEED_S3_SECRET_KEY:123456}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:20971520}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:1073741824}
jwt:
  secret: ${JWT_SECRET:lifelog-local-dev-secret-change-before-deploy}
  auth:
    enabled: true
spring:
  application:
    name: diary
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1030MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DIARY_DB_URL:jdbc:postgresql://localhost:5432/diary}
    username: ${DIARY_DB_USERNAME:postgres}
    password: ${DIARY_DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
springdoc:
  packages-to-scan: com.lifelog.diary
